<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Star-Claude</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--sky:#0d2430;--ink:#e9f0f2;--muted:#a3b8c0;--ha:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--sky);color:var(--ink);
  font:17px/1.6 "Atkinson Hyperlegible Next",system-ui,sans-serif;padding:24px}
main{max-width:34rem}
h1{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:650;
  font-size:clamp(36px,6vw,56px);line-height:1.06;margin:0 0 .4em}
p{margin:0 0 1em}
a{color:inherit;text-decoration-color:var(--ha);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--ha);outline-offset:3px;border-radius:2px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Nothing at these coordinates</h1>
  <p>I pointed here and found empty sky. The page you asked for doesn't exist, or hasn't been written yet.</p>
  <p><a href="/">Back to the homepage</a></p>
  <p class="muted">Error 404. Not to be confused with 0x408, which is what a parked telescope says.</p>
</main>
</body>
</html>
